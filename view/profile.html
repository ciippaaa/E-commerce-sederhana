
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>My Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/src/output.css">
</head>

<body
  class="min-h-screen bg-[#f8f3ee]"
  style="font-family:'Poppins',sans-serif;"
>

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-[#eadfd7]">

    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

      <a
        href="/view/index.html"
        class="text-4xl font-extrabold text-[#6b1230]"
      >
        HarvestHub
      </a>

      <a
        href="/view/produk.html"
        class="px-5 py-2.5 rounded-full bg-[#6b1230] text-white font-medium hover:bg-[#521024] transition"
      >
        Back
      </a>

    </div>

  </nav>

  <!-- PROFILE -->
  <section class="max-w-5xl mx-auto px-6 py-14">

    <div
      class="bg-white rounded-[40px] overflow-hidden border border-[#eadfd7] shadow-[0_15px_60px_rgba(107,18,48,0.08)]"
    >

      <!-- COVER -->
      <div
        class="relative h-64 bg-gradient-to-r from-[#6b1230] via-[#7d1840] to-[#9b2753]"
      >

        <div class="absolute top-0 right-0 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>

        <div class="absolute -bottom-20 left-0 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>

      </div>

      <!-- CONTENT -->
      <div class="relative px-8 sm:px-12 pb-12">

        <!-- PHOTO -->
        <div class="-mt-20 flex justify-center">

          <div
            class="w-40 h-40 rounded-full overflow-hidden border-[8px] border-white bg-white shadow-xl"
          >

            <img
              id="profileImage"
              src="/IMG/jaemin.jpg"
              alt="Profile"
              class="w-full h-full object-cover"
            >

          </div>

        </div>

        <!-- USER INFO -->
        <div class="text-center mt-6">

          <h1
            id="Jaemin"
            class="text-4xl sm:text-5xl font-bold tracking-tight text-[#3e2d23]"
          >
            Username
          </h1>

          <p
            id="email"
            class="mt-3 text-gray-500 text-lg"
          >
            Jaemin@gmail.com
          </p>

          <div
            class="mt-5 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#fff4ef]"
          >

            <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>

            <span class="text-sm font-medium text-[#6b1230]">
              Active Member
            </span>

          </div>

        </div>

        </div>

        <!-- STATS -->
        <div
          class="mt-14 grid grid-cols-3 border border-[#eadfd7] rounded-3xl overflow-hidden bg-white"
        >

          <div class="py-8 text-center">

            <h2 class="text-3xl font-bold text-[#6b1230]">
              12
            </h2>

            <p class="mt-1 text-gray-500">
              Orders
            </p>

          </div>

          <div class="py-8 text-center border-x border-[#eadfd7]">

            <h2 class="text-3xl font-bold text-[#6b1230]">
              8
            </h2>

            <p class="mt-1 text-gray-500">
              Wishlist
            </p>

          </div>

          <div class="py-8 text-center">

            <h2 class="text-3xl font-bold text-[#6b1230]">
              2026
            </h2>

            <p class="mt-1 text-gray-500">
              Member Since
            </p>

          </div>

        </div>

        <!-- LOGOUT -->
        <div class="mt-10">

          <button
            id="logoutBtn"
            class="w-full py-4 rounded-3xl bg-[#6b1230] text-white font-semibold hover:bg-[#521024] transition"
          >
            Logout
          </button>

        </div>

      </div>

    </div>

  </section>

  <script src="/script/profile.js"></script>

</body>
</html>
